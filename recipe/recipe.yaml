# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.16.0"

package:
  name: anaconda-client
  version: ${{ version }}

source:
  url: https://github.com/anaconda/anaconda-client/archive/${{ version }}.tar.gz
  sha256: 3abb6246aae258dde2cf06a72959ab6fe18385261c1e1b931f4208b6f6fb531e
  patches:
    # https://github.com/anaconda/anaconda-client/pull/942
    - 0001-restore-upload-label-aliases-with-user.patch

build:
  number: 1
  noarch: python
  script:
    - SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} ${{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed --disable-pip-version-check
  python:
    entry_points:
      - binstar = binstar_client.scripts.cli:main
      - conda-server = binstar_client.scripts.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs >=0.3
    - setuptools-scm >=7.1
    - hatch-requirements-txt
  run:
    - anaconda-cli-base >=0.9.1
    - anaconda-auth >=0.12.3
    - anaconda-opentelemetry >=1.2.2
    # Exact pin mirrors upstream's requirements.txt: click 8.5.0 deprecates
    # click.utils.get_binary_stream, which typer<0.26.0 still imports.
    - click ==8.4.1
    - conda-package-handling >=1.7.3
    - conda-package-streaming >=0.9.0
    - defusedxml >=0.7.1
    - nbformat >=4.4.0
    - platformdirs >=3.10.0,<5.0
    - python >=${{ python_min }}
    - python-dateutil >=2.6.1
    - pytz >=2021.3
    - pyyaml >=3.12
    - requests >=2.20.0
    - requests-toolbelt >=0.9.1
    - setuptools >=58.0.4
    - tqdm >=4.56.0
    - urllib3 >=1.26.4
    # Technically an `[extra]`, but fails to upload on any `icon`
    # https://github.com/conda-forge/anaconda-client-feedstock/issues/57
    - pillow >=10.2.0
    # binstar_client/inspect_package/pypi.py imports packaging, but upstream
    # doesn't declare it.
    - packaging

tests:
  - python:
      python_version: ${{ python_min }}.*
      pip_check: true
      imports:
        - binstar_client
        - binstar_client.commands
        - binstar_client.inspect_package
        - binstar_client.mixins
        - binstar_client.scripts
        - binstar_client.utils
        - binstar_client.utils.notebook
  - requirements:
      run:
        - python ${{ python_min }}.*
    files:
      recipe:
        - test_upload.py
    script:
      - binstar --help
      - python test_upload.py
      - conda-server --help
      - python -c "from binstar_client.utils.notebook.data_uri import DataURIConverter; DataURIConverter(None).check_pillow_installed()"

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: anaconda.org command line client library
  homepage: https://github.com/anaconda/anaconda-client
  repository: https://github.com/anaconda/anaconda-client
  documentation: https://www.anaconda.com/docs/tools/anaconda-org/commandreference

extra:
  recipe-maintainers:
    - jakirkham
    - goanpeca
    - mbargull
    - mattkram
